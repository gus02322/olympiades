# Déploiement automatique sur GitHub Pages à chaque push sur main.
# Aucune configuration secrète nécessaire : le site est 100 % statique.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer le déploiement à la main depuis l'onglet « Actions ».
  workflow_dispatch:

# Droits nécessaires pour publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on annule les anciennes en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
